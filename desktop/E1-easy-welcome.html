<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saral Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css"><link rel="stylesheet" href="desktop.css">
<script>try{var t=localStorage.getItem('dl-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head><body>
<div style="display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh">
  <!-- LEFT: Saral Brand panel -->
  <div style="background:linear-gradient(135deg,#1a0a4a 0%,#3E0DF5 50%,#5b2bf5 100%);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden">
    <div style="position:absolute;right:-100px;top:-100px;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.06)"></div>
    <div style="position:absolute;left:-60px;bottom:-80px;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.04)"></div>
    <div class="row" style="gap:12px"><span style="width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.15);display:grid;place-items:center">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </span><b style="font-size:24px">DigiLocker</b></div>
    <h1 style="font-size:44px;font-weight:900;line-height:1.08;margin:32px 0 16px;max-width:520px;letter-spacing:-1px">सरल मोड</h1>
    <p style="font-size:17px;opacity:.88;max-width:460px;line-height:1.65">आसान भाषा में DigiLocker</p>
    <div style="display:flex;gap:24px;margin-top:40px;opacity:.8;font-size:13px">
      <div class="row" style="gap:6px"><span data-ic="shield" data-icc="ic-sm"></span> End-to-end encrypted</div>
      <div class="row" style="gap:6px"><span data-ic="check" data-icc="ic-sm"></span> Government of India</div>
    </div>
  </div>

  <!-- RIGHT: Action panel -->
  <div style="display:grid;place-items:center;padding:48px;background:var(--bg)">
    <div style="width:min(420px,90%)">
      <h2 style="font-size:28px;font-weight:800;margin:0 0 8px">Welcome · सरल मोड</h2>
      <p class="muted" style="font-size:15px;line-height:1.55;margin:0 0 28px">Select your preferred language</p>

      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:28px">
        <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--dl-primary);border-radius:12px;background:var(--dl-primary-bg,#ede9fe);cursor:pointer">
          <input type="radio" name="lang" value="hi" checked style="accent-color:var(--dl-primary);width:18px;height:18px">
          <span style="font-size:15px;font-weight:600;color:var(--ink)">हिन्दी</span>
        </label>
        <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer">
          <input type="radio" name="lang" value="en" style="accent-color:var(--dl-primary);width:18px;height:18px">
          <span style="font-size:15px;font-weight:600;color:var(--ink)">English</span>
        </label>
        <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer">
          <input type="radio" name="lang" value="gu" style="accent-color:var(--dl-primary);width:18px;height:18px">
          <span style="font-size:15px;font-weight:600;color:var(--ink)">ગુજરાતી</span>
        </label>
        <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer">
          <input type="radio" name="lang" value="ta" style="accent-color:var(--dl-primary);width:18px;height:18px">
          <span style="font-size:15px;font-weight:600;color:var(--ink)">தமிழ்</span>
        </label>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:28px">
        <span style="font-size:15px;font-weight:600;color:var(--ink)">🔊 Read aloud</span>
        <div style="width:44px;height:24px;border-radius:12px;background:var(--dl-primary);position:relative;cursor:pointer">
          <div style="width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;right:2px;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div>
        </div>
      </div>

      <a class="btn lg" style="width:100%;justify-content:center;padding:16px;font-size:16px" href="E2-easy-home.html">Start</a>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
</body></html>
