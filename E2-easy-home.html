<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy Home</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css"><link rel="stylesheet" href="desktop.css">
<script>try{var t=localStorage.getItem('dl-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head><body>
<div style="display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh">
  <!-- LEFT: Saral Brand panel -->
  <div style="background:linear-gradient(135deg,#1a0a4a 0%,#3E0DF5 50%,#5b2bf5 100%);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden">
    <div style="position:absolute;right:-100px;top:-100px;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.06)"></div>
    <div style="position:absolute;left:-60px;bottom:-80px;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.04)"></div>
    <div class="row" style="gap:12px"><span style="width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.15);display:grid;place-items:center">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </span><b style="font-size:24px">DigiLocker</b></div>
    <h1 style="font-size:44px;font-weight:900;line-height:1.08;margin:32px 0 16px;max-width:520px;letter-spacing:-1px">सरल मोड</h1>
    <p style="font-size:17px;opacity:.88;max-width:460px;line-height:1.65">आसान भाषा में DigiLocker</p>
    <div style="display:flex;gap:24px;margin-top:40px;opacity:.8;font-size:13px">
      <div class="row" style="gap:6px"><span data-ic="shield" data-icc="ic-sm"></span> End-to-end encrypted</div>
      <div class="row" style="gap:6px"><span data-ic="check" data-icc="ic-sm"></span> Government of India</div>
    </div>
  </div>

  <!-- RIGHT: Action panel -->
  <div style="display:grid;place-items:center;padding:48px;background:var(--bg)">
    <div style="width:min(440px,90%)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <a href="E3-easy-show.html" class="card" style="padding:28px 20px;text-align:center;text-decoration:none;cursor:pointer">
          <div style="width:56px;height:56px;border-radius:14px;background:var(--dl-primary-bg,#ede9fe);display:grid;place-items:center;margin:0 auto 12px">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="var(--dl-primary)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h4v4H7zm6 0h4v4h-4zm-6 6h4v4H7zm6 0h4v4h-4z"/></svg>
          </div>
          <span style="font-size:15px;font-weight:700;color:var(--ink)">Show ID</span>
        </a>
        <a href="E4-easy-docs.html" class="card" style="padding:28px 20px;text-align:center;text-decoration:none;cursor:pointer">
          <div style="width:56px;height:56px;border-radius:14px;background:#dbeafe;display:grid;place-items:center;margin:0 auto 12px">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#2563eb" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <span style="font-size:15px;font-weight:700;color:var(--ink)">My Papers</span>
        </a>
        <a href="E5-easy-get.html" class="card" style="padding:28px 20px;text-align:center;text-decoration:none;cursor:pointer">
          <div style="width:56px;height:56px;border-radius:14px;background:#dcfce7;display:grid;place-items:center;margin:0 auto 12px">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#16a34a" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8m-4-4h8"/></svg>
          </div>
          <span style="font-size:15px;font-weight:700;color:var(--ink)">Get Paper</span>
        </a>
        <a href="E6-easy-talk.html" class="card" style="padding:28px 20px;text-align:center;text-decoration:none;cursor:pointer">
          <div style="width:56px;height:56px;border-radius:14px;background:#fef3c7;display:grid;place-items:center;margin:0 auto 12px">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#d97706" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
          </div>
          <span style="font-size:15px;font-weight:700;color:var(--ink)">Talk</span>
        </a>
        <a href="E7-easy-help.html" class="card" style="padding:28px 20px;text-align:center;text-decoration:none;cursor:pointer;grid-column:1/-1">
          <div style="width:56px;height:56px;border-radius:14px;background:#fee2e2;display:grid;place-items:center;margin:0 auto 12px">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#dc2626" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </div>
          <span style="font-size:15px;font-weight:700;color:var(--ink)">Help</span>
        </a>
      </div>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
</body></html>
