<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiLocker · Show ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">

<script>try{var _t=localStorage.getItem('dl-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>body{display:grid;place-items:center;min-height:100vh;padding:10px;background:transparent;scrollbar-width:none;overflow:hidden}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}body::-webkit-scrollbar{display:none}
.qbox{width:210px;height:210px;border-radius:16px;background:
 repeating-linear-gradient(90deg,#111 0 6px,transparent 6px 12px),
 repeating-linear-gradient(0deg,#111 0 6px,transparent 6px 12px);
 background-size:12px 12px;position:relative;margin:0 auto}
.qbox::after{content:"";position:absolute;inset:38%;background:#fff}</style>
</head><body>
<div class="phone"><div class="notch"></div>
  <div class="screen">
    <div class="statusbar"><span data-clock>9:41</span>
      <span class="sb-r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="22" height="11" viewBox="0 0 24 11" fill="none"><rect x="1" y="1" width="20" height="9" rx="2.5" stroke="currentColor" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="15" height="6" rx="1" fill="currentColor"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </span></div>
    <div class="view">
      <div class="appbar"><button class="iconbtn" onclick="goBack('06-home.html')" aria-label="Back"><span data-ic="back"></span></button><div class="title grow">Show ID</div>
        <span class="badge green"><span data-ic="check" data-icc="ic-sm"></span>Offline-ready</span></div>
      <div class="pad" style="padding-top:14px">
        <div class="seg"><button class="on" onclick="tab(this)">QR</button><button onclick="tab(this);toast('Tap to a reader','nfc')">Tap (NFC)</button></div>

        <div class="qrcard mt5">
          <div class="scanline"></div>
          <div class="qr qbox"></div>
          <div class="center mt4"><div class="bold">Aadhaar · Debabrata N.</div><div class="sm muted">Verifiable presentation · signed on-device</div></div>
        </div>

        <div class="card mt5">
          <div class="between"><span class="sm bold">This QR proves</span></div>
          <div class="row wrap gap2 mt3"><span class="chip on">Name</span><span class="chip on">Photo</span><span class="chip on">Age over 18</span></div>
          <div class="sm muted mt3">Valid for <b class="tnum">04:58</b> · anyone scanning verifies authenticity without calling a server.</div>
        </div>

        <div class="alert ok mt5"><span data-ic="shield" data-icc="ic-sm"></span><span>Device-signed offline token. Works at checkpoints with no network.</span></div>

        <button class="btn ghost block mt5" onclick="nav('09-share.html')">Change what I show</button>
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
<script src="../assets/app.js"></script>
</body></html>
