<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiLocker · Credentials</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">

<script>try{var _t=localStorage.getItem('dl-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>body{display:grid;place-items:center;min-height:100vh;padding:10px;background:transparent;scrollbar-width:none;overflow:hidden}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}body::-webkit-scrollbar{display:none}</style>
</head><body>
<div class="phone"><div class="notch"></div>
  <div class="screen">
    <div class="statusbar"><span data-clock>9:41</span>
      <span class="sb-r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="22" height="11" viewBox="0 0 24 11" fill="none"><rect x="1" y="1" width="20" height="9" rx="2.5" stroke="currentColor" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="15" height="6" rx="1" fill="currentColor"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </span></div>
    <div class="view">
      <div class="appbar"><button class="iconbtn" onclick="goBack('06-home.html')" aria-label="Back"><span data-ic="back"></span></button><div class="title grow">Verifiable Credentials</div>
        <button class="iconbtn" onclick="nav('23-scan.html')" aria-label="Scan"><span data-ic="scan"></span></button></div>
      <div class="pad" style="padding-top:14px">
        <div class="alert info"><span data-ic="shield" data-icc="ic-sm"></span><span>Cryptographic credentials you can present with selective disclosure — reveal only what's needed.</span></div>

        <div class="cred tier1 sk-edu mt5">
          <div class="glow"></div><div class="ribbon"></div><div class="foil"></div>
          <div class="ct"><div class="emb"><span data-ic="award"></span></div><span class="vbadge"><span class="seal"><span data-ic="check"></span></span>SD-JWT</span></div>
          <div class="cname">Degree Credential</div><div class="cissuer">University of Pune</div>
          <div class="cnum">B.Tech · 2008</div><div class="cfoot"><div><small>Type</small><b>W3C VC 2.0</b></div><div style="text-align:right"><small>Status</small><b>Valid</b></div></div></div>

        <div class="h3 mt6">Present with selective disclosure</div>
        <div class="card mt3">
          <div class="a11yrow" style="border-top:0"><span class="sm grow">Degree name</span><button class="switch on" onclick="pin(this)"><i></i></button></div>
          <div class="a11yrow"><span class="sm grow">Institution</span><button class="switch on" onclick="pin(this)"><i></i></button></div>
          <div class="a11yrow"><span class="sm grow">Year of passing</span><button class="switch" onclick="pin(this)"><i></i></button></div>
          <div class="a11yrow"><span class="sm grow">Grade / CGPA</span><button class="switch" onclick="pin(this)"><i></i></button></div>
        </div>
        <div class="row gap2 mt5">
          <button class="btn grow" onclick="nav('10-verify.html')"><span data-ic="qr" data-icc="ic-sm"></span> Present</button>
          <button class="btn ghost grow" onclick="toast('Offline token minted','nfc')"><span data-ic="nfc" data-icc="ic-sm"></span> Offline</button>
        </div>
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
<script src="../assets/app.js"></script>
</body></html>
