<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiLocker · Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">

<script>try{var _t=localStorage.getItem('dl-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>body{display:grid;place-items:center;min-height:100vh;padding:10px;background:transparent;scrollbar-width:none;overflow:hidden}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}body::-webkit-scrollbar{display:none}
.inpwrap{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--hair);border-radius:14px;padding:4px 14px}
.inpwrap:focus-within{border-color:var(--dl-primary);box-shadow:var(--focus)}
.field{border:0;box-shadow:none;padding:15px 0;width:100%;font-size:16px;color:var(--ink);font-family:inherit;background:transparent;scrollbar-width:none;overflow:hidden}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}body::-webkit-scrollbar{display:none}
.field:focus{outline:0}
.sim{display:flex;align-items:center;gap:12px;border:1.5px solid var(--hair);border-radius:16px;padding:14px;cursor:pointer;background:var(--surface);box-shadow:var(--e1)}
.sim.on{border-color:var(--dl-primary);box-shadow:0 0 0 2px var(--dl-primary-100)}
.sim .r{width:22px;height:22px;border-radius:50%;border:2px solid var(--g400);flex:0 0 auto;display:grid;place-items:center}
.sim.on .r{border-color:var(--dl-primary)} .sim.on .r::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--dl-primary)}
.sim .si{width:42px;height:42px;border-radius:12px;background:var(--dl-primary-50);color:var(--dl-primary);display:grid;place-items:center;flex:0 0 auto}</style>
</head><body>
<div class="phone"><div class="notch"></div>
  <div class="screen">
    <div class="statusbar"><span data-clock>9:41</span>
      <span class="sb-r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="22" height="11" viewBox="0 0 24 11" fill="none"><rect x="1" y="1" width="20" height="9" rx="2.5" stroke="currentColor" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="15" height="6" rx="1" fill="currentColor"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </span></div>
    <div class="view">
      <div class="appbar"><button class="iconbtn" onclick="goBack('03-login.html')" aria-label="Back"><span data-ic="back"></span></button><div class="title">Mobile number</div></div>
      <div class="pad" style="padding-top:14px">

        <!-- SIM selection (default) -->
        <div id="simView">
          <div class="body ink2">Continue with a number already on this phone.</div>
          <div class="col gap2 mt5">
            <div class="sim on" id="sim1" onclick="selSim('sim1')"><span class="r"></span><span class="si"><span data-ic="phone"></span></span><div class="grow"><div class="bold sm">SIM 1 · Jio</div><div class="sm muted">+91 98765 43210</div></div></div>
            <div class="sim" id="sim2" onclick="selSim('sim2')"><span class="r"></span><span class="si"><span data-ic="phone"></span></span><div class="grow"><div class="bold sm">SIM 2 · Airtel</div><div class="sm muted">+91 90123 45678</div></div></div>
          </div>
          <div class="alert info mt4"><span data-ic="shield" data-icc="ic-sm"></span><span>If this number has one or more accounts, you'll pick a profile → MPIN → OTP. New number → account set up automatically.</span></div>
          <button class="btn lg block mt5" onclick="cont()">Continue</button>
          <button class="btn ghost block mt3" onclick="showManual()"><span data-ic="pen" data-icc="ic-sm"></span> Try with a different number</button>
        </div>

        <!-- Manual entry -->
        <div id="manualView" style="display:none">
          <div class="body ink2">Enter a mobile number to continue.</div>
          <label class="sm bold mt5" style="display:block">Mobile number</label>
          <div class="inpwrap mt2"><span class="bold ink2">+91</span><input class="field" inputmode="numeric" maxlength="10" placeholder="98765 43210"></div>
          <button class="btn lg block mt6" onclick="cont()">Continue</button>
          <button class="btn ghost block mt3" onclick="showSim()"><span data-ic="phone" data-icc="ic-sm"></span> Use a SIM on this phone</button>
        </div>

      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
function selSim(id){document.getElementById('sim1').classList.toggle('on',id==='sim1');document.getElementById('sim2').classList.toggle('on',id==='sim2');}
function showManual(){document.getElementById('simView').style.display='none';document.getElementById('manualView').style.display='block';}
function showSim(){document.getElementById('manualView').style.display='none';document.getElementById('simView').style.display='block';}
// Mobile flow (existing user): profile(s) exist -> choose profile -> MPIN -> OTP -> home.
function cont(){ nav('67-select-profile.html'); }
</script>
</body></html>
