<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiLocker · Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">

<script>try{var _t=localStorage.getItem('dl-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>body{display:grid;place-items:center;min-height:100vh;padding:10px;background:transparent;scrollbar-width:none;overflow:hidden}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}body::-webkit-scrollbar{display:none}</style>
</head><body>
<div class="phone"><div class="notch"></div>
  <div class="screen">
    <div class="statusbar"><span data-clock>9:41</span>
      <span class="sb-r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="22" height="11" viewBox="0 0 24 11" fill="none"><rect x="1" y="1" width="20" height="9" rx="2.5" stroke="currentColor" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="15" height="6" rx="1" fill="currentColor"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </span></div>
    <div class="view">
      <div class="appbar"><button class="iconbtn" onclick="goBack('06-home.html')" aria-label="Back"><span data-ic="back"></span></button><div class="title grow">Notifications</div><a class="link sm" onclick="toast('All marked read','check')">Mark all</a></div>
      <div class="pad" style="padding-top:14px">
        <div class="card row" style="border-left:4px solid var(--dl-primary)"><div class="lico" style="background:var(--dl-primary-50);color:var(--dl-primary)"><span data-ic="shield"></span></div><div class="grow"><div class="bold sm">Approve sign-in to IRCTC?</div><div class="sm muted">Just now · tap to review</div></div><button class="btn sm" onclick="toast('Opened request','shield')">Review</button></div>
        <div class="eyebrow mt6">Earlier</div>
        <div class="card mt3">
          <div class="lrow"><div class="lico"><span data-ic="plus"></span></div><div class="grow"><div class="bold sm">New document available</div><div class="sm muted">CBSE pushed your marksheet · 1h</div></div></div>
          <div class="lrow"><div class="lico" style="color:var(--warning)"><span data-ic="clock"></span></div><div class="grow"><div class="bold sm">Insurance expiring in 8 days</div><div class="sm muted">RC · MH 02 CK 9920 · 3h</div></div></div>
          <div class="lrow" style="border-bottom:0"><div class="lico" style="color:var(--green)"><span data-ic="check"></span></div><div class="grow"><div class="bold sm">Share to HDFC completed</div><div class="sm muted">Yesterday</div></div></div>
        </div>
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
<script src="../assets/app.js"></script>
</body></html>
