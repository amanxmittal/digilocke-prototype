<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiLocker · View nominee</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">

<script>try{var _t=localStorage.getItem('dl-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>body{display:grid;place-items:center;min-height:100vh;padding:10px;background:transparent;scrollbar-width:none;overflow:hidden}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}body::-webkit-scrollbar{display:none}</style>
</head><body>
<div class="phone"><div class="notch"></div>
  <div class="screen">
    <div class="statusbar"><span data-clock>9:41</span>
      <span class="sb-r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="22" height="11" viewBox="0 0 24 11" fill="none"><rect x="1" y="1" width="20" height="9" rx="2.5" stroke="currentColor" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="15" height="6" rx="1" fill="currentColor"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </span></div>
    <div class="view">
      <div class="appbar"><button class="iconbtn" onclick="goBack('17-nominee.html')" aria-label="Back"><span data-ic="back"></span></button><div class="title">Nominee details</div></div>
      <div class="pad" style="padding-top:14px">
        <div class="card row">
          <div id="av" style="width:56px;height:56px;border-radius:16px;background:var(--dl-grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px">SN</div>
          <div class="grow"><div class="h3" id="name">Sunita Nayak</div><div class="sm muted" id="relation">Wife</div></div>
        </div>

        <div class="card mt4">
          <div class="fieldfill"><div class="v"><div class="lab">Date of birth</div><div class="val" id="dob">12-04-1988</div></div></div>
          <div class="fieldfill"><div class="v"><div class="lab">Gender</div><div class="val" id="gender">Female</div></div></div>
          <div class="fieldfill"><div class="v"><div class="lab">Mobile</div><div class="val" id="mobile">+91 90123 45678</div></div></div>
          <div class="fieldfill" id="emailRow" style="border-bottom:0"><div class="v"><div class="lab">Email</div><div class="val" id="email">sunita.n@example.com</div></div></div>
        </div>

        <button class="btn ghost block mt6" style="color:var(--danger)" onclick="confirmDo('Remove nominee?','This removes '+document.getElementById('name').textContent+' as your nominee.','Remove',true,'Nominee removed','trash','17-nominee.html')"><span data-ic="trash" data-icc="ic-sm"></span> Remove nominee</button>
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var name=q.get('name'),relation=q.get('relation'),dob=q.get('dob'),gender=q.get('gender'),mobile=q.get('mobile'),email=q.get('email');
  if(name){
    document.getElementById('name').textContent=name;
    document.getElementById('av').textContent=name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
  }
  if(relation) document.getElementById('relation').textContent=relation;
  if(dob) document.getElementById('dob').textContent=dob;
  if(gender) document.getElementById('gender').textContent = gender==='M'?'Male':(gender==='F'?'Female':'Other');
  if(mobile) document.getElementById('mobile').textContent=mobile;
  if(email!==null){
    if(email){ document.getElementById('email').textContent=email; }
    else { document.getElementById('emailRow').style.display='none'; }
  }
})();
</script>
</body></html>
