<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiLocker · MPIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">

<script>try{var _t=localStorage.getItem('dl-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>body{display:grid;place-items:center;min-height:100vh;padding:10px;background:transparent;scrollbar-width:none;overflow:hidden}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}body::-webkit-scrollbar{display:none}
.pindot{width:16px;height:16px;border-radius:50%;border:2px solid var(--dl-primary)}
.pindot.on{background:var(--dl-primary)}
.chkrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--hair);border-radius:14px;padding:13px 14px;box-shadow:var(--e1)}
.biohero{width:112px;height:112px;border-radius:50%;background:var(--dl-primary-50);color:var(--dl-primary);display:grid;place-items:center;margin:0 auto;cursor:pointer}
.biohero.scanning{animation:mpulse 1.1s infinite}
@keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(62,13,245,.35)}50%{box-shadow:0 0 0 14px rgba(62,13,245,0)}}</style>
</head><body>
<div class="phone"><div class="notch"></div>
  <div class="screen">
    <div class="statusbar"><span data-clock>9:41</span>
      <span class="sb-r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="22" height="11" viewBox="0 0 24 11" fill="none"><rect x="1" y="1" width="20" height="9" rx="2.5" stroke="currentColor" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="15" height="6" rx="1" fill="currentColor"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </span></div>
    <div class="view">
      <div class="pad center" style="padding-top:64px" id="pad">

        <!-- BIOMETRIC-FIRST VIEW (returning user, biometric already enabled) -->
        <div id="bioView" style="display:none">
          <div class="biohero" id="bioHero" onclick="scanBio()"><span data-ic="fp" data-icc="ic-lg"></span></div>
          <div class="h1 mt5">Unlock DigiLocker</div>
          <div class="body ink2 mt2" id="bioTxt">Use your fingerprint or face to continue.</div>
          <a class="link sm" style="display:inline-block;margin-top:22px" onclick="showKeypad()">Use MPIN instead</a>
        </div>

        <!-- MPIN KEYPAD VIEW -->
        <div id="pinView">
          <div id="pinAvatar" style="width:64px;height:64px;border-radius:20px;background:var(--dl-primary-50);color:var(--dl-primary);display:grid;place-items:center;margin:0 auto"><span data-ic="lock" data-icc="ic-lg"></span></div>
          <div class="h1 mt5" id="pinHeading">Enter your MPIN</div>
          <div class="body ink2 mt2" id="pinSub">6-digit PIN keeps your wallet locked.</div>
          <div class="row mt6" style="justify-content:center;gap:14px" id="pins">
            <span class="pindot on"></span><span class="pindot on"></span><span class="pindot on"></span><span class="pindot"></span><span class="pindot"></span><span class="pindot"></span>
          </div>

          <div class="keypad mt6" style="max-width:280px;margin:24px auto 0">
            <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button>
            <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button>
            <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button>
            <button style="background:transparent;border:0;box-shadow:none"></button>
            <button onclick="press('0')">0</button>
            <button onclick="press('<')" aria-label="Delete"><span data-ic="back"></span></button>
          </div>

          <!-- shown whenever biometric is NOT currently enabled — mirrors v2's cvEnableBiometric -->
          <div class="chkrow mt5" id="enableBioRow" style="max-width:280px;margin:20px auto 0;cursor:default">
            <span data-ic="fp" data-icc="ic-sm"></span>
            <span class="sm bold grow" style="text-align:left">Enable biometric login for next time</span>
            <button class="switch" id="enableBioSwitch" onclick="toggleEnableBio()"><i></i></button>
          </div>

          <a class="link sm" id="forgotLink" style="display:inline-block;margin-top:18px" onclick="nav('63-forgot-dob.html')">Forgot MPIN?</a>
        </div>

      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
function nextTarget(){var m=location.hash.match(/next=([^&]+)/);return m?decodeURIComponent(m[1]):'06-home.html';}
var qs = new URLSearchParams(location.search);
var isReturning = qs.get('ctx')==='returning';
var switchTo = qs.get('switchTo'); // set when arriving from 75-switch-account.html
var switchInit = qs.get('init')||'';
var bioEnabled = localStorage.getItem('dl-biometric-enabled')==='true';
var enableBioChecked = false;

// When switching profiles (same-number Switch Account OR the separate any-person Add
// Account list), personalize the MPIN prompt and skip the "enable biometric" nudge —
// v2's from="switchAccount" path is MPIN-only, no extra prompts.
if(switchTo){
  document.getElementById('pinHeading').textContent = 'Enter MPIN for '+switchTo;
  document.getElementById('pinSub').textContent = 'Switching account · this device stays locked to everyone else.';
  document.getElementById('pinAvatar').textContent = switchInit;
  document.getElementById('pinAvatar').style.background = 'var(--dl-grad)';
  document.getElementById('pinAvatar').style.color = '#fff';
  document.getElementById('pinAvatar').style.fontWeight = '800';
}

// v2 parity:
// - "returning" context (quick unlock / switch account) + biometric enabled -> auto-prompt biometric, hide Forgot MPIN.
// - "returning" context + biometric NOT enabled -> keypad + enable-checkbox, no Forgot MPIN.
// - normal in-flow MPIN (mobile/Aadhaar/VID/signup) -> keypad + enable-checkbox + Forgot MPIN always shown.
function init(){
  if(isReturning){
    document.getElementById('forgotLink').style.display='none';
    if(bioEnabled){
      document.getElementById('bioView').style.display='block';
      document.getElementById('pinView').style.display='none';
      setTimeout(scanBio, 500); // auto-trigger, like v2's checkDeviceLock() on load
      return;
    }
  }
  document.getElementById('bioView').style.display='none';
  document.getElementById('pinView').style.display='block';
  if(switchTo){
    // Switching profiles never offers "enable biometric" or "forgot MPIN" mid-switch.
    document.getElementById('enableBioRow').style.display='none';
    document.getElementById('forgotLink').style.display='none';
    return;
  }
  // Only offer the "enable" checkbox if biometric isn't already on for this device.
  document.getElementById('enableBioRow').style.display = bioEnabled ? 'none' : 'flex';
}
function showKeypad(){
  document.getElementById('bioView').style.display='none';
  document.getElementById('pinView').style.display='block';
  document.getElementById('enableBioRow').style.display = bioEnabled ? 'none' : 'flex';
}
function scanBio(){
  var h=document.getElementById('bioHero');h.classList.add('scanning');
  document.getElementById('bioTxt').textContent='Scanning…';
  setTimeout(function(){
    h.classList.remove('scanning');
    document.getElementById('bioTxt').textContent='Verified ✓';
    toast('Biometric verified','check');
    setTimeout(function(){nav(nextTarget());},500);
  },1200);
}
function toggleEnableBio(){
  var sw=document.getElementById('enableBioSwitch');
  pin(sw); // shared toggle helper from app.js — flips .on + aria-checked
  enableBioChecked=sw.classList.contains('on');
  if(enableBioChecked){
    // v2 triggers the device's confirm-credential screen (Keyguard) right away.
    toast('Confirm your device screen lock to enable biometric','fp');
  }
}
var dots=[].slice.call(document.querySelectorAll('#pins .pindot'));var i=3;
function press(k){if(k==='<'){if(i>0){i--;dots[i].classList.remove('on');}return;}
  if(i<6){dots[i].classList.add('on');i++; if(i===6) setTimeout(function(){
      if(enableBioChecked){ localStorage.setItem('dl-biometric-enabled','true'); }
      if(switchTo){
        localStorage.setItem('dl-active-profile-name', switchTo);
        localStorage.setItem('dl-active-profile-init', switchInit);
        toast('Switched to '+switchTo,'check');
      }
      nav(nextTarget());
    },380);}}
init();
</script>
</body></html>
